 return `${pageHead('ZIELFLAGGE / '+esc(s.classId),esc(res.eventName),'Saison '+s.season+' · Runde '+(s.round+1))}<section class="result-hero ${res.dnf?'bad':''}"><div class="result-position">${res.dnf?'DNF':'P'+res.position}</div><div class="result-copy"><span class="eyebrow green">${res.dnf?'RÜCKSCHLAG, KEIN KARRIEREENDE':s.classId==='Hypercar'&&r.event.id==='lemans'&&res.position===1?'GESAMTSIEG IN LE MANS':r.event.id==='lemans'?'KLASSENERGEBNIS IN LE MANS':solo?'SPRINT · DIREKTES TEAMDUELL':'GEMEINSAMES TEAMERGEBNIS'}</span><h1>${title}</h1><p>${res.dnf?'Der Einsatz ist vorbei, aber Chronik und nächster Vertrag bleiben erreichbar.':`Mit diesem Auto lag die vereinfachte Erwartung bei P${res.expected}. ${solo?'Du erreichst P'+res.position+' und kannst dich direkt mit deinen Teamkollegen vergleichen.':'Ihr erreicht P'+res.position+' in der Klasse'+(r.event.multiclass?' und P'+res.overall+' gesamt':'')+'.'}`}</p>${button((last?'Zur Saisonbilanz':'Zum nächsten Rennwochenende')+' '+icon('arrow'),'next-round','primary')}</div></section><div class="grid4">${metric('MEISTERSCHAFT','+'+res.points,'Punkte aus diesem Einsatz')}${metric('DEIN RUF','+'+num(res.repGain,1),'Leistung relativ zur Erwartung')}${metric('TEAM-ERGEBNIS',compact(res.net),'Einnahmen minus Kosten')}${metric('FORMAT',solo?'SPRINT':r.event.driverCount+' FAHRER',solo?'Eigene Autos':'Gemeinsames Auto')}</div><div class="grid2 space-top">${driverPanel}<section class="panel"><div class="panel-head"><h2>Nach dem Rennen</h2><span class="badge ${s.prep.interviewed?'':'grey'}">${s.prep.interviewed?'BEANTWORTET':'INTERVIEW'}</span></div><p class="small">„Was nimmst du aus diesem Rennen mit?“</p><div class="choices">${[['team','„Dieses Ergebnis gehört der ganzen Mannschaft.“','Teammoral +4'],['ambition','„Wir haben noch größere Ziele.“','Dein Ruf +1'],['honest','„Wir schauen uns unsere Fehler genau an.“','Deine Konstanz +0,6']].map(([id,txt,sub])=>`<button class="choice" data-interview="${id}" ${s.prep.interviewed? function renderTeam(){const s=state,manage=s.role==='manager',locked=s.phase!=='preparation'||!!s.race,cmp=E.teamComparison(s);const managerSprint=(()=>{const m=new Map();for(const h of s.history.filter(x=>x.format==='solo')){const primary=(h.drivers||[]).find(d=>d.minutes>0);const entries=[primary?{id:primary.id,name:primary.name,position:h.position,qualifyingPosition:h.qualifyingPosition,dnf:h.dnf,points:h.points,bestLap:h.bestLap}:null,...(h.teammates||[])].filter(Boolean);const fastest=Math.min(...entries.filter(x=>Number.isFinite(x.bestLap)).map(x=>x.bestLap),Infinity);for(const x of entries){let r=m.get(x.id);if(!r){r={id:x.id,name:x.name,races:0,points:0,wins:0,podiums:0,poles:0,fastestLaps:0,dnfs:0,finishSum:0,finishN:0};m.set(x.id,r);}r.races++;r.points+=x.points||0;r.wins+=x.position===1?1:0;r.podiums+=x.position>0&&x.position<=3?1:0;r.poles+=x.qualifyingPosition===1?1:0;r.fastestLaps+=Number.isFinite(x.bestLap)&&x.bestLap===fastest?1:0;r.dnfs+=x.dnf?1:0;if(x.position){r.finishSum+=x.position;r.finishN++;}}}return [...m.values()].map(x=>({...x,avgFinish:x.finishN?Number((x.finishSum/x.finishN).toFixed(1)):0}));})();const comparison=manage?(managerSprint.length?`<section class="panel"><div class="panel-head"><div><h2>Sprint-Teamstatistik</h2><p>Alle Autos deines Teams werden getrennt ausgewertet.</p></div><span class="badge">TEAMDATEN</span></div><div class="big-table-wrap"><table class="big-table"><thead><tr><th>Fahrer</th><th>Siege</th><th>Podien</th><th>Poles</th><th>FL</th><th>Punkte</th><th>Ø Ziel</th></tr></thead><tbody>${managerSprint.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.wins}</td><td>${x.podiums}</td><td>${x.poles}</td><td>${x.fastestLaps}</td><td>${num(x.points)}</td><td>${x.avgFinish||'–'}</td></tr>`).join('')}</tbody></table></div></section>`:`<section class="panel"><h2>Sprint-Teamstatistik</h2><p class="small muted">Nach dem ersten Sprint mit getrennten Autos erscheinen hier die Werte deiner Fahrer.</p></section>`):(cmp.sprint.events?`<section class="panel"><div class="panel-head"><div><h2>Sprint-Teamkollegenvergleich</h2><p>${cmp.sprint.events} Rennen mit getrennten Autos.</p></div><span class="badge">HEAD-TO-HEAD</span></div><div class="big-table-wrap"><table class="big-table"><thead><tr><th>Du vs.</th><th>Quali H2H</th><th>Rennen H2H</th><th>Punkte</th><th>Ø Ziel</th></tr></thead><tbody>${cmp.sprint.teammates.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.playerQualifyingH2H||0} : ${t.qualifyingH2H||0}</td><td>${t.playerRaceH2H||0} : ${t.raceH2H||0}</td><td>${num(cmp.sprint.player.points)} : ${num(t.points)}</td><td>${cmp.sprint.player.avgFinish||'–'} : ${t.avgFinish||'–'}</td></tr>`).join('')}</tbody></table></div><div class="big-table-wrap space-top"><table class="big-table"><thead><tr><th>Fahrer</th><th>Siege</th><th>Podien</th><th>Poles</th><th>FL</th><th>DNF</th><th>Punkte</th></tr></thead><tbody><tr class="own"><td>${esc(s.player.name)} · DU</td><td>${cmp.sprint.player.wins}</td><td>${cmp.sprint.player.podiums}</td><td>${cmp.sprint.player.poles}</td><td>${cmp.sprint.player.fastestLaps}</td><td>${cmp.sprint.player.dnfs}</td><td>${num(cmp.sprint.player.points)}</td></tr>${cmp.sprint.teammates.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.wins}</td><td>${t.podiums}</td><td>${t.poles}</td><td>${t.fastestLaps}</td><td>${t.dnfs}</td><td>${num(t.points)}</td></tr>`).join('')}</tbody></table></div></section>`:`<section class="panel"><h2>Sprint-Teamkollegenvergleich</h2><p class="small muted">Nach dem ersten Sprint mit getrennten Autos erscheinen hier Qualifying-, Renn-, Pole-, Punkte- und Ergebnisvergleiche.</p></section>`);const shared=cmp.shared.events?`<section class="panel"><div class="panel-head"><div><h2>Endurance-Stintvergleich</h2><p>${cmp.shared.events} gemeinsame Rennen.</p></div><span class="badge grey">SHARED CAR</span></div>${cmp.shared.drivers.map(d=>`<div class="driver-mini"><div class="avatar ${d.id==='player'?'you':''}">${esc(initials(d.name))}</div><div><div class="name">${esc(d.name)}</div><small>${duration(d.minutes)} Rennzeit · ${d.errors} Fehler</small></div><span class="score">${d.rating?num(d.rating,1):'–'}</span></div>`).join('')}<p class="tiny muted space-top">Das Rating fasst den simulierten Stint relativ zu Pace, Bedingungen, Ermüdung und Fehlern zusammen. Es entscheidet nicht allein über Verträge.</p></section>`:'';
 return `${pageHead(esc(s.team.brand.toUpperCase())+' / '+esc(s.classId),esc(s.team.name),'Sprint: getrennte Autos und direktes Duell. Endurance: gemeinsame Besetzung und gemeinsame Verantwortung.',`<span class="badge">${manage?'TEAMMANAGEMENT':'DEINE CREW'}</span>`)}<div class="grid3">${s.team.drivers.map(driverCard).join('')}</div><div class="section-title"><h2>Euer Vergleich</h2></div><div class="grid2">${comparison}${shared||'<section class="panel"><h2>Endurance-Stintvergleich</h2><p class="small muted">Nach dem ersten gemeinsamen Endurance-Rennen erscheinen hier die individuellen Stintwerte.</p></section>'}</div><div class="section-title"><h2>Auto & Mannschaft</h2><span class="pill">${esc(E.carLabel(s))}</span></div><div class="grid3">${[['quality','Abstimmung','Setuparbeit und Streckenabstimmung.'],['pitCrew','Boxencrew','Bessere Abläufe verkürzen die Standzeit.'],['reliability','Zuverlässigkeit','Wartung verringert das Risiko technischer Probleme.']].map(([key,name,desc])=>`<section class="upgrade-card"><div class="row between"><h3>${name}</h3>${icon(key==='quality'?'wrench':key==='pitCrew'?'bolt':'shield')}</div><div class="value">${num(s.team[key])}<span class="small muted"> / 100</span></div>${meter(s.team[key])}<p style="margin-top:15px">${desc}</p>${manage?`<button class="btn ghost full" data-upgrade="${key}" ${locked||s.team.budget<E.upgradeCost(s,key)||s.team[key]>=96?'disabled':''}>+3 verbessern · ${compact(E.upgradeCost(s,key))}</button>`:''}</section>`).join('')}</div><div class="note space-top">${manage?'Team-Budget: '+money(s.team.budget)+'. Verbesserungen und Fahrerwechsel sind nur vor dem Rennen möglich.':'Als Fahrer entwickelt sich dein Marktwert durch Leistung, Stärke, Ruf, Alter und Klasse – nicht durch dein Kontoguthaben.'} Reale Teamnamen dienen nur der Spielwelt; Performance und Finanzen sind fiktiv.</div>${manage?`<div class="section-title"><h2>Fahrermarkt</h2><span class="badge grey">ANGEBOTE FÜR DIESE RUNDE</span></div><div class="row wrap space-bottom"><label class="field" style="min-width:240px;max-width:100%">Welchen Platz möchtest du neu besetzen?<select id="hire-slot">${driverOptions(hireSlot)}</select></label><p class="tiny" style="max-width:380px">Marktwert zeigt die sportliche Größenordnung; die einmalige Verpflichtung kostet im Spiel einen Anteil davon.</p></div><div class="grid3">${E.candidates(s).map(d=>`<article class="market-candidate"><div class="row between">${avatar(d)}<span class="badge grey">${categoryName(d.category)}</span></div><h3>${country(d.country)} ${esc(d.name)}</h3><p>${esc(d.specialty)} · Gesamt ${num(E.average(d))}</p><div class="stat-line"><span>Marktwert</span><b>${compact(d.marketValue)}</b></div><div class="stat-line"><span>Nacht / Regen / Konstanz</span><b>${num(d.night)} / ${num(d.wet)} / ${num(d.consistency)}</b></div><div class="price">${money(d.price)} <span class="tiny muted">Verpflichtung</span></div><button class="btn ghost full small-btn" data-hire="${d.id}" ${locked||s.team.budget<d.price||s.team.drivers.some(x=>x.id===d.id)?'disabled':''}>${s.team.drivers.some(x=>x.id===d.id)?'Bereits im Team':'Verpflichten'}</button></article>`).join('')}</div><p class="small muted space-top">Die Besetzungsregeln sind für das Spiel vereinfacht.</p>`:''}<div class="section-title"><h2>Euer Saisonpartner</h2><span class="pill">${s.sponsorPicked?'Vertrag unterschrieben':'Einmal pro Saison wählbar'}</span></div><div class="grid3">${D.SPONSORS.map(sp=>`<article class="sponsor-card ${s.team.sponsor===sp.id?'selected':''}"><span class="eyebrow">${sp.tag}</span><h3>${sp.name}</h3><p>${sp.text}</p><div class="stat-line"><span>Pro Rennen</span><b>${compact(sp.base*D.CLASSES[s.classId].scale)}</b></div><div class="stat-line"><span>Erfolgsbonus</span><b>${compact(sp.bonus*D.CLASSES[s.classId].scale)}</b></div><button class="btn ${s.team.sponsor===sp.id?'primary':'ghost'} full small-btn" data-sponsor="${sp.id}" ${locked||s.sponsorPicked?'disabled':''}>${s.team.sponsor===sp.id?(s.sponsorPicked?'Aktiver Partner':'Diesen Partner bestätigen'):'Partner wählen'}</button></article>`).join('')}</div>`;

function renderCalendar(){const s=state;return `${pageHead('DEINE SAISON '+s.year,'Sprintduelle und gemeinsame Langstrecke.','Der Spielkalender mischt unterschiedliche Rennformate und ist keine Wiedergabe eines offiziellen Kalenders.')}<div class="note space-bottom">${s.classId==='GT4'?'Dein Einstieg verbindet Sprints mit eigenen Autos und erste gemeinsame Langstreckenrennen.':s.classId==='GT3'?'GT3 bleibt ein vollständiger Karriereweg mit Sprint und Endurance.':s.classId==='LMP3'?'LMP3 ist ein Prototypen-Karriereast – nicht einfach die nächste Stufe über GT3.':'Le Mans ist ein Saisonhöhepunkt, keine eigene Fahrzeugklasse.'} ${s.mode==='quick'?'Schnellmodus: größere Zeitsprünge.':'Standardmodus: mehr Rennentscheidungen.'}</div>${s.calendar.map((ev,i)=>{const done=s.history.find(h=>h.season===s.season&&h.eventId===ev.id),current=i===s.round&&!done;return `<article class="calendar-card ${current?'current':''} ${done?'done':''}"><span class="round-number">${String(i+1).padStart(2,'0')}</span><div><div class="row wrap"><span class="eyebrow" style="font-size:8px;margin:0">${country(ev.country)} ${esc(ev.label)}</span><span class="badge ${ev.format==='solo'?'amber':'grey'}">${formatName(ev.format)}</span>${ev.special?'<span class="badge amber">24H-HIGHLIGHT</span>':''}${ev.lmgt3?'<span class="badge grey">LMGT3</span>':''}</div><h3>${esc(ev.name)}</h3><p>${duration(ev.minutes)} · ${esc(ev.character)}${ev.multiclass?' · Mehrklassenverkehr':''}</p></div><div>${done?`<span class="calendar-result">${done.dnf?'DNF':'P'+done.position}</span><div class="tiny muted center">${done.points} Punkte</div>`:current?`<button class="btn primary small-btn" data-nav="${s.race?'race':'garage'}">${s.race?'Rennen':'Vorbereiten'}</button>`:`<span class="pill">${duration(ev.minutes)}</span>`}</div></article>`;}).join('')}`;}
function renderMarket(){const s=state,off=E.offers(s),progress=Object.keys(D.CLASSES),last=s.archive[s.archive.length-1],mv=E.marketValue(s.player,s.classId,s),life=E.lifestyleBenefits(s);const lifestyle=s.role==='driver'?`<div class="section-title"><h2>Dein Leben abseits der Strecke</h2><span class="pill">Guthaben ${compact(s.money)}</span></div><div class="grid3">${D.ASSETS.map(a=>{const owned=s.assets.includes(a.id),superseded=D.ASSETS.some(x=>(x.replaces||[]).includes(a.id)&&s.assets.includes(x.id));return `<article class="offer-card ${owned?'selected':''}"><span class="badge ${owned?'':'grey'}">${owned?'BESITZT DU':superseded?'ERSETZT':'LIFESTYLE'}</span><h3>${esc(a.name)}</h3><p>${esc(a.text||'Eine persönliche Investition in deine Karriere abseits der Strecke.')}</p><div class="offer-money">${compact(a.price)}</div><small>${assetEffect(a)} · ${a.upkeep?compact(a.upkeep)+' laufende Kosten/Saison':'keine laufenden Kosten'}</small><button class="btn ${owned?'ghost':'primary'} full" data-buy="${a.id}" ${owned||superseded||s.money<a.price||s.phase==='race'?'disabled':''}>${owned?'Bereits in deinem Besitz':superseded?'Durch bessere Variante ersetzt':'Kaufen'}</button></article>`;}).join('')}</div><div class="note space-top">Lifestyle gibt kleine, nachvollziehbare Vorteile: Simulator → Training, Wohnen → Erholung/Glück, Autos → Motivation/Prestige. Dein Marktwert steigt nicht dadurch, dass du Geld ausgibst. Aktuelle laufende Kosten: ${compact(life.upkeep)} pro Saison.</div>`:'';
 const offers=s.phase==='offseason'?`${last?`<section class="result-hero"><div class="result-position">P${last.position}</div><div class="result-copy"><span class="eyebrow green">SAISON ${last.year} ABGESCHLOSSEN</span><h1>${last.position===1?'Ein Team. Ein Titel.':'Eine Saison, auf der du aufbauen kannst.'}</h1><p>${num(last.points)} Punkte in der Teamwertung · Meister: ${esc(last.champion)}.</p><button class="btn ghost small-btn" data-nav="history">Zur Chronik ${icon('history')}</button></div></section>`:''}<div class="section-title"><h2>Deine Vertragsangebote</h2><span class="badge">1–3 SAISONEN</span></div><div class="grid3">${off.map(o=>`<article class="offer-card"><span class="badge ${o.sameClass?'':'grey'}">${o.classId}${o.sameClass?' · GLEICHE KLASSE':''}</span><h3>${esc(o.name)}</h3><p><b class="green">${esc(o.title)}</b><br>${esc(o.text)}</p><div class="stat-line"><span>Vertragsdauer</span><b>${o.term} Saison${o.term===1?'':'en'}</b></div><div class="stat-line"><span>Interesse</span><b>${o.interest}/100</b></div><div class="offer-money">${compact(s.role==='driver'?o.salary:o.funding)}</div><small>${s.role==='driver'?'Saison-Gehalt beim Unterschreiben / Fortsetzen':'Finanzierung für das Programm'}</small><div class="stat-line" style="margin-top:18px"><span>Teamstärke</span><b>${num(o.quality)}/100</b></div>${meter(o.quality)}<button class="btn primary full" data-offer="${o.id}">Vertrag annehmen ${icon('arrow')}</button></article>`).join('')}</div>${s.role==='driver'?`<section class="panel space-top"><div class="row between wrap"><div><h3>Vom Cockpit an die Boxenmauer?</h3><p class="small" style="margin-top:6px">Behalte deine Chronik und führe die Karriere künftig als Teammanager weiter.</p></div>${button('In die Managerrolle wechseln','switch-role','ghost')}</div></section>`:''}`:`<section class="panel"><div class="panel-head"><div><h2>Was öffnet die nächste Tür?</h2><p>Keine Klasse wird mehr durch eine einzelne Rufzahl freigeschaltet.</p></div><span class="badge">MARKTWERT ${compact(mv)}</span></div><div class="grid2 space-top"><div><h3>Vertrag</h3><div class="stat-line"><span>Team</span><b>${esc(s.contract.team)}</b></div><div class="stat-line"><span>Laufzeit</span><b>${s.contract.remaining} / ${s.contract.term} Saison${s.contract.term===1?'':'en'} verbleibend</b></div><div class="stat-line"><span>Gehalt</span><b>${compact(s.contract.salary)}</b></div></div><div><h3>Interesse entsteht aus</h3><p class="small">Leistung, Fahrerwerten, Ruf, Alter, bisheriger Klasse und Ergebnissen. Ein starker GT3-Fahrer kann in GT3 bleiben, in Prototypen wechseln oder bei außergewöhnlicher Entwicklung Hypercar-Interesse wecken.</p></div></div></section>`;
 return `${pageHead('DEIN WEG IM LANGSTRECKENSPORT',s.phase==='offseason'?'Das nächste Kapitel beginnt hier.':'Deine Karriere ist kein linearer Levelbaum.','GT und Prototypen sind verbundene Karriereäste. Teamwechsel innerhalb derselben Klasse sind ausdrücklich möglich.')}<div class="roadmap">${progress.map(cl=>`<div class="roadmap-stop ${s.classId===cl?'current':''}"><span class="eyebrow" style="font-size:8px;letter-spacing:1px">${s.classId===cl?'DU BIST HIER':s.history.some(h=>h.classId===cl)?'TEIL DEINER CHRONIK':'KARRIEREAST'}</span><b>${cl}</b><small>${esc(D.CLASSES[cl].subtitle)}</small></div>`).join('')}</div><p class="small muted space-bottom">Mögliche Wege: GT4 → GT3 oder LMP3; GT3 ↔ Prototypen; LMP2 → Hypercar. GT3 ist kein Karriereende und Hypercar ist kein Pflichtziel.</p>${offers}<section class="panel space-top"><h3>Dein Fahrerlager-Profil</h3><div class="grid3 space-top"><div><div class="stat-line"><span>Ruf</span><b>${num(s.reputation)}/100</b></div>${meter(s.reputation)}</div><div><div class="stat-line"><span>Marktwert</span><b>${compact(mv)}</b></div><p class="tiny muted">Sportlicher Spielwert, unabhängig vom Kontostand.</p></div><div><div class="stat-line"><span>${s.role==='driver'?'Glück':'Zusammenhalt'}</span><b>${num(s.role==='driver'?s.happiness:s.team.morale)}/100</b></div>${meter(s.role==='driver'?s.happiness:s.team.morale)}</div></div><p class="tiny muted space-top">Ruf ist nur noch ein Teil der Vertragslogik. Bronze/Silber/Gold/Platin sind vereinfachte Spieleinstufungen.</p></section>${lifestyle}`;}
function renderHistory(){const s=state,total=s.history.length,wins=s.history.filter(h=>h.position===1).length,podia=s.history.filter(h=>h.position>0&&h.position<=3).length,lemans=s.history.filter(h=>h.eventId==='lemans'&&h.position===1).length;return `${pageHead('DEINE KARRIERECHRONIK','Was bleibt, ist eure Geschichte.','Jede Saison, jedes große Rennen und jeder gemeinsame Erfolg werden in diesem Spielstand bewahrt.')}<div class="grid4">${metric('RENNEN',total,'Abgeschlossene Einsätze')}${metric('KLASSENSIEGE',wins,'Gemeinsame Siege')}${metric('PODIEN',podia,'Top 3 in deiner Klasse')}${metric('LE-MANS-SIEGE',lemans,'Klassen- oder Gesamtsieg')}</div><div class="section-title"><h2>Eure Meilensteine</h2></div>${s.achievements.length?`<div class="grid3">${s.achievements.map(a=>`<div class="achievement">${icon('trophy')}<div><b>${esc(a.name)}</b><small>Saison ${a.season}</small></div></div>`).join('')}</div>`:`<div class="empty">${icon('flag')}<h3>Deine Geschichte beginnt an der Startlinie.</h3><p>Beende dein erstes Rennen, um die erste Zielflagge in deiner Chronik festzuhalten.</p></div>`}<div class="section-title"><h2>Saisonarchiv</h2><span class="pill">${s.archive.length} abgeschlossene Saisonen</span></div>${[...new Set(s.history.map(h=>h.season))].reverse().map(season=>{const entries=s.history.filter(h=>h.season===season),ar=s.archive.find(a=>a.season===season);return `<details class="archive-year" ${season===s.season?'open':''}><summary><div class="row"><span class="year">${entries[0].year}</span><div><h3>${esc(entries[0].team)} · ${entries[0].classId}</h3><small>${ar?'Abgeschlossen · Teamwertung P'+ar.position:'Saison läuft'} · ${entries.length} Rennen</small></div></div><span class="green">+</span></summary><div class="archive-content"><div class="big-table-wrap"><table class="big-table"><thead><tr><th>Rennen</th><th>Ergebnis</th><th>Punkte</th></tr></thead><tbody>${entries.map(h=>`<tr><td>${esc(h.eventName)}</td><td>${h.dnf?'DNF':'P'+h.position}</td><td>${h.points}</td></tr>`).join('')}</tbody></table></div>${ar?`<p class="table-note">Saisonmeister: ${esc(ar.champion)} · Dein Team: ${ar.points} Punkte.</p><details class="help space-top"><summary>Vollständige Team-Endwertung</summary><div class="big-table-wrap"><table class="big-table"><tbody>${ar.standings.teams.map((t,i)=>`<tr class="${t.own?'own':''}"><td>${i+1}</td><td>${esc(t.name)}</td><td>${t.points}</td></tr>`).join('')}</tbody></table></div></details>`:''}</div></details>`;}).join('')||'<div class="empty"><p>Nach der ersten Zielflagge erscheinen deine Rennergebnisse hier.</p></div>'}`;}
function helpContent(){return `<div class="help"><details open><summary>Wie funktionieren Sprint und Endurance?</summary><p><b>Sprint:</b> Jeder Teamfahrer hat ein eigenes Auto. Du fährst direkt gegen deine Teamkollegen und sammelst Head-to-Head-Statistiken. <b>Endurance:</b> Zwei oder drei Fahrer teilen sich ein Auto. Reifen, Tank, Schäden und Position gehören dem Auto und werden beim Fahrerwechsel nicht zurückgesetzt.</p></details><details><summary>Wie funktionieren Fahrertyp und Marktwert?</summary><p>Dein Fahrertyp wird automatisch aus deinen aktuellen Stärken berechnet, etwa Nachtprofi, Reifenspezialist, Teamplayer oder Allrounder. Der Marktwert nutzt Fahrerwerte, Klasse, Alter, Ruf und jüngere Ergebnisse. Dein Kontostand und gekaufte Luxusgüter erhöhen ihn nicht direkt.</p></details><details><summary>Wie funktionieren Verträge und Aufstiege?</summary><p>Verträge laufen ein bis drei Saisonen. Du kannst am Saisonende innerhalb derselben Klasse das Team wechseln oder – wenn dein Profil passt – einen anderen Karriereast wählen. Ein Aufstieg hängt nicht nur vom Ruf ab: Erfahrung in der aktuellen Klasse und deine persönliche Saisonleistung zählen ebenfalls. Eine normale gute Rookie-Saison führt deshalb meist noch nicht direkt weiter; eine außergewöhnliche Saison kann trotzdem frühes Interesse auslösen. GT3 ist eine vollwertige Profi-Karriere und keine Sackgasse.</p></details><details><summary>Wofür ist persönliches Geld da?</summary><p>In der Fahrerkarriere kannst du Simulatoren, Wohnraum und Autos kaufen. Ein Simulator verstärkt Training, gutes Wohnen unterstützt Erholung und Glück, Autos wirken stärker auf Motivation/Prestige. Besitz verursacht teilweise laufende Saisonkosten. Das System ist bewusst kein direktes „Geld kaufen = schneller fahren“.</p></details><details><summary>Wer entscheidet im Langstreckenrennen über Stopps?</summary><p>Tankstint, Boxenstopp und Fahrerwechsel sind getrennt. In Langstreckenrennen bleibt ein Fahrer normalerweise mehrere Tankstints im Auto. In der Fahrerkarriere bekommst du an wichtigen Fenstern die Wahl zwischen Box und Draußenbleiben; in der Managerkarriere kontrollierst du den detaillierten Boxenauftrag selbst. Kurze Schauer können bewusst ausgesessen werden, wenn die Prognose das sinnvoll erscheinen lässt.</p></details><details><summary>Schnellmodus oder Standardmodus?</summary><p>Beide verwenden dieselbe Simulation. Schnellmodus springt in größeren Zeitabschnitten, Standardmodus gibt dir mehr Entscheidungen. Die Karriereinhalte bleiben gleich.</p></details><details><summary>Was ist Realität, was ist Spiel?</summary><p>Die Teamnamen in Version 2 orientieren sich an öffentlich gelisteten 2026er Teams der jeweiligen Klassen. Fahrer, Leistungswerte, Marktwerte, Budgets, Vertragswerte und der kompakte Kalender sind Spielwerte. Offizielle Logos und Lackierungen werden nicht verwendet. Regeln, Fahrerklassifikationen, Neutralisationen und Besetzungsregeln sind für ein Entscheidungsspiel vereinfacht.</p><p>Hintergrundquellen: ${D.SOURCES.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}</a>`).join(' · ')}.</p></details><details><summary>Wie sicher sind meine Spielstände?</summary><p>Das Spiel nutzt weiterhin dieselben drei lokalen Speicherplätze. Alte V1-Spielstände werden beim Laden automatisch auf V2 ergänzt. Es gibt kein Konto und keine Cloud-Synchronisation; Export/Import bleibt daher die sicherste geräteübergreifende Sicherung.</p></details><details><summary>Bedienung</summary><p>Die drei Rennentscheidungen können am Computer mit 1, 2 und 3 gewählt werden. Escape schließt Dialoge. Auf dem Handy liegen weitere Seiten unter „Mehr“.</p></details></div>`;}
function renderSettings(){const s=state;return `${pageHead('DEIN SPIEL, DEIN TEMPO','Speichern & Spielhilfe','Drei getrennte Spielstände. Keine Anmeldung. Deine Daten bleiben bei dir.')}<section class="panel space-bottom"><div class="settings-row"><div><h3>Rennmodus</h3><p>Der Standardmodus hat mehr Entscheidungen.<br>Änderungen gelten ab dem nächsten Rennen.</p></div><div class="switch-group"><button data-mode="quick" class="${s.mode==='quick'?'active':''}">Schnell</button><button data-mode="standard" class="${s.mode==='standard'?'active':''}">Standard</button></div></div><div class="settings-row"><div><h3>Speicherplatz ${activeSlot} ist aktiv</h3><p>${storageOK?'Jede Entscheidung wird automatisch lokal gesichert.':'Speichern ist blockiert. Exportiere deinen Spielstand regelmäßig.'}</p></div><span class="badge ${storageOK?'':'amber'}">${storageOK?'AUTOSAVE':'EXPORT NÖTIG'}</span></div><div class="settings-row"><div><h3>Eine eigene Sicherung</h3><p>Exportiere eine JSON-Datei, auch mitten im Rennen.</p></div>${button(icon('download')+' Export','export','primary')}</div><div class="settings-row"><div><h3>Spielstand übernehmen</h3><p>Vor dem Import wird der Inhalt geprüft und der Zielplatz bestätigt.</p></div>${button(icon('upload')+' Import','import','ghost')}</div></section>${savedCards(true)}<div class="section-title"><h2>Alles Wichtige zum Spiel</h2>${icon('help')}</div><section class="panel">${helpContent()}</section><div class="note space-top">ENDURANCE 2.2 · Eigenständiges, nicht offiziell verbundenes Motorsport-Entscheidungsspiel. Keine externen Dienste oder KI-Schlüssel nötig. Ein öffentlicher Link ist erst nach Hosting dieser Dateien vorhanden.</div>`;}
function render(){const scroll=window.scrollY;app.innerHTML=state?shell(({garage:renderGarage,race:renderRace,team:renderTeam,standings:renderStandings,calendar:renderCalendar,market:renderMarket,history:renderHistory,settings:renderSettings}[view]||renderGarage)()):renderHome();renderModal();if(window.scrollY!==scroll)window.scrollTo({top:scroll});}
function readNewForm(){const get=id=>document.getElementById(id)?.value;const old=modal?.options||{};return {...old,name:get('career-name')??old.name,age:Number(get('career-age')??old.age),country:get('career-country')??old.country,slot:Number(get('career-slot')??old.slot),classId:get('career-class')??old.classId,teamName:get('career-team')??old.teamName,teamStyle:get('career-style')??old.teamStyle,mode:get('career-mode')??old.mode};}
function newCareer(role='driver',scenario=null){let slot=[1,2,3].find(i=>!readSlot(i))||1;modal={type:'new',options:{role,scenario,name:'Mario Trefflinger',age:21,country:'AT',slot,classId:scenario?'Hypercar':'GT4',teamName:'',teamStyle:'balanced',mode:'quick'}};renderModal();}
function confirm(title,text,callback,label='Bestätigen'){modal={type:'confirm',title,text,callback,label};renderModal();}
function createFrom(o){state=E.createCareer({...o,seed:crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*4294967295)});activeSlot=o.slot;view='garage';modal=null;save();render();window.scrollTo(0,0);toast('Deine Karriere ist gestartet. Viel Erfolg mit der Mannschaft!');}
function modalFrame(title,body){return `<div class="modal-overlay" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="Dialog schließen">${icon('close')}</button></header><div class="modal-content">${body}</div></section></div>`;}
function renderModal(){document.body.classList.toggle('modal-open',!!modal);if(!modal){modalRoot.innerHTML='';return;}let body='',title='';
 if(modal.type==='new'){const o=modal.options,startClass=o.scenario?'Hypercar':o.role==='driver'?'GT4':o.classId,teams=D.TEAM_POOLS[startClass]||[];if(!teams.some(t=>t.name===o.teamName))o.teamName=teams[0]?.name||'';title=o.scenario?'24h-Challenge: Le Mans':'Dein erstes Kapitel';body=`<form id="new-career-form"><div class="role-select"><button type="button" data-role="driver" class="role-option ${o.role==='driver'?'active':''}">${icon('steering')}<b>Fahrerkarriere</b><small>${o.scenario?'Du teilst dir das Hypercar mit zwei Kollegen.':'Du beginnst in GT4 und entwickelst deine Karriere.'}</small></button><button type="button" data-role="manager" class="role-option ${o.role==='manager'?'active':''}">${icon('team')}<b>Managerkarriere</b><small>Du entscheidest für Fahrer, Team und Strategie.</small></button></div><div class="form-grid"><label class="field mobile-full">Dein Name<input id="career-name" name="name" required maxlength="40" autocomplete="off" value="${esc(o.name)}"></label><label class="field">Alter<input id="career-age" type="number" min="16" max="70" step="1" value="${o.age}" required></label><label class="field">Nationalität<select id="career-country">${[['AT','Österreich'],['DE','Deutschland'],['CH','Schweiz'],['HR','Kroatien'],['IT','Italien'],['FR','Frankreich'],['GB','Großbritannien'],['US','USA']].map(([c,n])=>`<option value="${c}" ${o.country===c?'selected':''}>${country(c)} ${n}</option>`).join('')}</select></label><label class="field">Startklasse<select id="career-class" ${o.role==='driver'||o.scenario?'disabled':''}>${Object.keys(D.CLASSES).map(cl=>`<option value="${cl}" ${(startClass===cl)?'selected':''}>${cl}</option>`).join('')}</select></label><label class="field mobile-full">Team<select id="career-team">${teams.map(t=>`<option value="${esc(t.name)}" ${o.teamName===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label class="field">Spieltempo<select id="career-mode"><option value="quick" ${o.mode==='quick'?'selected':''}>Schnell – weniger Entscheidungen</option><option value="standard" ${o.mode==='standard'?'selected':''}>Standard – mehr Entscheidungen</option></select></label><label class="field">Ausgangslage<select id="career-style"><option value="academy" ${o.teamStyle==='academy'?'selected':''}>Aufbauprogramm</option><option value="balanced" ${o.teamStyle==='balanced'?'selected':''}>Ausgewogenes Team</option><option value="front" ${o.teamStyle==='front'?'selected':''}>Stärkeres Auto, weniger Budget</option></select></label><label class="field">Speicherplatz<select id="career-slot">${[1,2,3].map(i=>`<option value="${i}" ${o.slot===i?'selected':''}>Platz ${i} · ${readSlot(i)?'belegt':'frei'}</option>`).join('')}</select></label></div><div class="note space-top">${o.scenario?'Du startest direkt bei den 24 Stunden von Le Mans.':'Eine Saison umfasst sechs Rennen. Teamwechsel innerhalb derselben Klasse und 1–3-Jahres-Verträge sind möglich.'} Die Teamnamen orientieren sich an 2026er Starterfeldern; Leistungswerte und Finanzen sind fiktiv.</div><div class="modal-buttons"><button type="button" class="btn ghost" data-action="close-modal">Zurück</button><button type="submit" class="btn primary">Karriere beginnen ${icon('arrow')}</button></div></form>`;}
 else if(modal.type==='help'){title='Willkommen in der Langstrecke';body=helpContent();}
 else if(modal.type==='confirm'){title=esc(modal.title);body=`<p>${esc(modal.text)}</p><div class="modal-buttons">${button('Abbrechen','close-modal','ghost')}${button(esc(modal.label),'confirm','primary')}</div>`;}
 else if(modal.type==='more'){title='Dein Paddock';body=`<div class="nav-list">${navs.map(([id,ico,n])=>`<button class="nav-item ${view===id?'active':''}" data-nav="${id}">${icon(ico)}${n}</button>`).join('')}</div><div class="divider"></div>${button('Zum Hauptmenü','home','ghost full')}`;}
 else if(modal.type==='pit'){const c=E.ownCar(state),r=state.race,solo=r.event.format==='solo',need=E.pitNeed(state);title='Dein Boxenauftrag';body=`<p>Auftanken ist enthalten. Neue Reifen und Reparaturen kosten zusätzliche Zeit.${solo?' Im Sprint bleibt derselbe Fahrer im Auto.':' In Endurance bleibt der aktuelle Fahrer standardmäßig im Auto; ein Fahrerwechsel ist eine eigene Strategieentscheidung.'}</p>${state.role==='manager'?`<div class="note">Position P${E.racePosition(state)} · Vordermann ${need.gapAhead?num(need.gapAhead,1)+' s':'–'} · Hintermann ${need.gapBehind?num(need.gapBehind,1)+' s':'–'}${need.reasons.length?' · '+esc(need.reasons.join(' · ')):''}</div>`:''}<form id="pit-form"><div class="form-grid"><label class="field mobile-full">${solo?'Fahrer':'Wer fährt danach?'}<select id="pit-driver" ${solo?'disabled':''}>${driverOptions(c.driver,c.drivers,c.active)}</select></label><label class="field">Reifen<select id="pit-tyres"><option value="keep">Reifen behalten (${num(c.tyres)} %)</option><option value="slick" ${E.getWeather(r)<50?'selected':''}>Neue Slicks</option><option value="wet" ${E.getWeather(r)>=50?'selected':''}>Neue Regenreifen</option></select></label><label class="field">Reparatur<select id="pit-repair"><option value="none">Keine Reparatur</option><option value="quick">Schnell: bis zu 14 % Schaden</option><option value="full">Vollständig: ${num(c.damage)} %</option></select></label></div><div class="note space-top">Aktuell: ${num(c.fuel)} % Tank · ${num(c.tyres)} % Reifen · ${num(c.damage)} % Schaden. ${solo?'Dein Schwesterauto-Team fährt unabhängig weiter.':'Tankstopp und Fahrerwechsel sind getrennt. Wenn du denselben Fahrer auswählst, setzt er seinen Fahrer-Einsatz nach dem Stopp fort.'}</div><div class="modal-buttons"><button type="button" class="btn ghost" data-action="close-modal">Zurück</button><button type="submit" class="btn primary">Boxenauftrag ausführen ${icon('wrench')}</button></div></form>`;}
 else if(modal.type==='qualifying'){title='Qualifying · '+esc(state.race.event.name);const rows=state.race.qualifying.filter(x=>x.classId===state.classId);body=`<p>${state.race.event.format==='solo'?'Jeder Fahrer setzte eine eigene Zeit in seinem Auto.':'Die Startreihenfolge wurde aus Fahrer, Auto, Vorbereitung und Risiko simuliert.'}</p><table class="big-table"><thead><tr><th>Pos.</th><th>${state.race.event.format==='solo'?'Fahrer / Team':'Team'}</th><th>Zeit</th></tr></thead><tbody>${rows.map((x,i)=>`<tr class="${x.own?'own':x.teamMate?'teammate':''}"><td>${i+1}</td><td>${esc(x.name)}</td><td>${Math.floor(x.time/60)}:${num(x.time%60,3).padStart(6,'0')}</td></tr>`).join('')}</tbody></table>`;}
 modalRoot.innerHTML=modalFrame(title,body);queueMicrotask(()=>modalRoot.querySelector('[data-action="close-modal"]')?.focus({preventScroll:true}));
}
function exportSave(){if(!state){toast('Lade zuerst einen Spielstand.',true);return;}try{const blob=new Blob([E.serialise(state)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ENDURANCE-S${state.season}-${state.classId}-Spielstand.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Deine Sicherungsdatei wurde erzeugt.');}catch(err){toast(err.message,true);}}
function chooseRace(id){if(busy)return;busy=true;mutate(()=>E.choose(state,id));setTimeout(()=>busy=false,140);}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
 if(el.dataset.nav){navigate(el.dataset.nav);return;}
 if(el.dataset.role){const o=readNewForm();o.role=el.dataset.role;if(o.role==='driver'&&!o.scenario)o.classId='GT4';modal={type:'new',options:o};renderModal();return;}
 if(el.dataset.load){openSlot(Number(el.dataset.load));return;}
 if(el.dataset.choice){chooseRace(el.dataset.choice);return;}
 if(el.dataset.prepare){mutate(()=>E.prepare(state,el.dataset.prepare),'Deine Wochenend-Vorbereitung ist abgeschlossen.');return;}
 if(el.dataset.interview){mutate(()=>E.interview(state,el.dataset.interview),'Deine Antwort ist im Team angekommen.');return;}
 if(el.dataset.table){tableTab=el.dataset.table;render();return;}
 if(el.dataset.timing){timingTab=el.dataset.timing;render();return;}
 if(el.dataset.upgrade){mutate(()=>E.develop(state,el.dataset.upgrade),'Die Verbesserung ist für das nächste Rennen verfügbar.');return;}
 if(el.dataset.hire){const d=E.candidates(state).find(x=>x.id===el.dataset.hire),slot=hireSlot;confirm('Fahrer verpflichten?',`${d.name} ersetzt ${state.team.drivers[slot].name}. Die einmalige Ablöse beträgt ${money(d.price)}.`,()=>mutate(()=>E.hire(state,d.id,slot),'Deine neue Besetzung steht.'),'Verpflichten');return;}
 if(el.dataset.sponsor){mutate(()=>E.chooseSponsor(state,el.dataset.sponsor),'Der Partnervertrag ist für diese Saison unterschrieben.');return;}
 if(el.dataset.buy){const a=D.ASSETS.find(x=>x.id===el.dataset.buy);confirm('Kauf bestätigen?',`${a.name} kostet ${money(a.price)}${a.upkeep?' und '+money(a.upkeep)+' pro Saison im Unterhalt':''}.`,()=>mutate(()=>E.buyAsset(state,a.id),a.name+' gehört jetzt dir.'),'Kaufen');return;}
 if(el.dataset.offer){const id=el.dataset.offer;mutate(()=>{E.acceptOffer(state,id);view='garage';},'Willkommen im nächsten Kapitel deiner Karriere.');window.scrollTo(0,0);return;}
 if(el.dataset.mode){mutate(()=>{state.mode=el.dataset.mode;},'Das neue Spieltempo gilt ab dem nächsten Rennen.');return;}
 if(el.dataset.copy){const target=Number(el.dataset.copy),run=()=>{activeSlot=target;save();render();toast('Spielstand in Platz '+target+' gesichert.');};if(readSlot(target)&&target!==activeSlot)confirm('Speicherplatz ersetzen?','Der bisherige Inhalt von Speicherplatz '+target+' wird durch deine aktuelle Karriere ersetzt.',run,'Hier sichern');else run();return;}
 if(el.dataset.delete){const slot=Number(el.dataset.delete);confirm('Spielstand wirklich löschen?','Der lokale Spielstand in Platz '+slot+' wird gelöscht. Bereits exportierte Sicherungsdateien bleiben erhalten.',()=>{memory.delete(slot);try{localStorage.removeItem(KEY(slot));localStorage.removeItem(KEY(slot)+'-date');}catch{}if(slot===activeSlot)state=null;render();},'Löschen');return;}
 const action=el.dataset.action;if(!action)return;
 if(action==='new-driver')newCareer('driver');
 else if(action==='new-manager')newCareer('manager');
 else if(action==='challenge')newCareer('driver','lemans');
 else if(action==='help'){modal={type:'help'};renderModal();}
 else if(action==='close-modal'){modal=null;renderModal();}
 else if(action==='more'){modal={type:'more'};renderModal();}
 else if(action==='home'){save();state=null;modal=null;render();window.scrollTo(0,0);}
 else if(action==='start-race'){mutate(()=>{E.startRace(state);view='race';});window.scrollTo(0,0);}
 else if(action==='next-round'){mutate(()=>{E.nextRound(state);view=state.phase==='offseason'?'market':'garage';});window.scrollTo(0,0);}
 else if(action==='pit'){modal={type:'pit'};renderModal();}
 else if(action==='suggested-driver-change'){const sug=E.suggestedDriverChange(state);if(!sug){toast('Die spontane Wechselchance ist nicht mehr aktuell.',true);return;}mutate(()=>E.pit(state,{driver:sug.driver,tyres:sug.tyres,repair:'none'}),sug.name+' übernimmt außerplanmäßig. Der weitere Stintplan wurde neu berechnet.');}
 else if(action==='qualifying'){modal={type:'qualifying'};renderModal();}
 else if(action==='export')exportSave();
 else if(action==='import')document.getElementById('import-file').click();
 else if(action==='confirm'){const cb=modal?.callback;modal=null;renderModal();try{cb?.();}catch(err){toast(err.message,true);}}
 else if(action==='switch-role')confirm('An die Boxenmauer wechseln?','Deine bisherige Karriere bleibt in der Chronik. Ab jetzt übernimmst du dauerhaft die Managerrolle und wählst anschließend einen Vertrag für die nächste Saison.',()=>mutate(()=>E.switchToManager(state),'Du bist jetzt Teammanager.'),'Rolle wechseln');
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.plan){const key=el.dataset.plan,val=['start','night','finish'].includes(key)?Number(el.value):el.value;mutate(()=>E.setPlan(state,{[key]:val}));}
 else if(el.id==='career-class'&&modal?.type==='new'){const o=readNewForm();o.classId=el.value;o.teamName=(D.TEAM_POOLS[o.classId]||[])[0]?.name||'';modal={type:'new',options:o};renderModal();}
 else if(el.id==='hire-slot')hireSlot=Number(el.value);
});
document.addEventListener('submit',e=>{if(e.target.id==='new-career-form'){e.preventDefault();const o=readNewForm();if(readSlot(o.slot)){confirm('Speicherplatz '+o.slot+' ersetzen?','Dort liegt bereits eine Karriere. Beim Start wird sie ersetzt. Ein anderer Speicherplatz schützt deine bisherige Karriere.',()=>createFrom(o),'Neue Karriere starten');}else createFrom(o);}
 else if(e.target.id==='pit-form'){e.preventDefault();const opts={driver:Number(document.getElementById('pit-driver').value),tyres:document.getElementById('pit-tyres').value,repair:document.getElementById('pit-repair').value};modal=null;mutate(()=>E.pit(state,opts),'Boxenauftrag ausgeführt. Der Zeitverlust zählt im nächsten Kapitel.');}
});
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>2500000)throw new Error('Diese Datei ist zu groß. Erwartet wird ein ENDURANCE-JSON-Spielstand.');const imported=E.parse(await file.text());const slot=state?activeSlot:[1,2,3].find(i=>!readSlot(i))||1;confirm('Geprüften Spielstand importieren?',`${imported.player.name} · ${imported.classId} · Saison ${imported.season}. Der Import wird in Speicherplatz ${slot} übernommen${readSlot(slot)?' und ersetzt dessen bisherigen Inhalt':''}.`,()=>{state=imported;activeSlot=slot;view=state.race?'race':state.phase==='offseason'?'market':'garage';save();render();window.scrollTo(0,0);toast('Spielstand übernommen. Deine Karriere geht genau hier weiter.');},'Spielstand übernehmen');}catch(err){toast(err.message,true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal();return;}if(modal&&e.key==='Tab'){const items=[...modalRoot.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href],summary')];if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}if(modal||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(['1','2','3'].includes(e.key)&&state?.race&&!state.race.finished&&view==='race'){e.preventDefault();const ch=E.choices(state)[Number(e.key)-1];if(ch)chooseRace(ch.id);}});
window.addEventListener('storage',e=>{if(state&&e.key===KEY(activeSlot))toast('Dieser Speicherplatz wurde in einem anderen Tab geändert. Lade ihn unter „Speichern & Hilfe“ neu, bevor du weiterspielst.',true);});
// Every successful mutation is already saved; closing a stale tab must not overwrite a newer save.
render();
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
})();
</script></body></html>
